<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>「プリン」は絶対食べるなよ！！</title>
  <meta name="description" content="妹のちひろが帰るまでに、冷蔵庫のデザートを見極めてお腹を満たそう。">
  <meta name="theme-color" content="#f6c453">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="プリン食べるな">
  <!-- フォント：Google Fonts から自動で読み込む（閲覧者のインストール不要）。
       読み込めない環境では style.css の代替フォント（端末の丸ゴシックなど）で表示される -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Mochiy+Pop+One&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/main.js"></script>
  <script>
    // オフラインでも遊べるように Service Worker を登録する（https か localhost のときだけ動く）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
